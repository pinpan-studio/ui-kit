<div style="width: 500px; height: 100%; border: none; overflow: hidden; background-color: #fff; display:flex; flex-direction:column;">
  <app-overlay-spiner [progress]="progress"></app-overlay-spiner>

  <div mat-dialog-title matPadding style="display:flex; flex-direction:row; justify-content:flex-end; align-items:center;">
    <div matPadding style="font-weight: 100; font-size: 20px; flex:1;">Modifiez votre mot de passe</div>

    <button (click)="close()"  mat-icon-button>
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div style="display:flex; flex-direction:column; flex:1;" >
    <div style="display:flex; flex-direction:column;">
      <div style="display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; flex:1;">

        <form  matPadding [formGroup]="pForm" class="inscription-form mat-padding" style="flex:1; display:flex; flex-direction:column;">
          <div matPadding style="display:flex; flex-direction:column;">
            <div style="display:flex; flex-direction:column;">
              <mat-form-field appearance="outline">
                <mat-label>Mot de passe actuel</mat-label>
                <mat-icon matSuffix>more_horiz</mat-icon>
                <input matInput type="password"  placeholder="Entrez votre mot de passe actuel" formControlName="pass"  autocomplete="off">
              </mat-form-field>
            </div>
            <div class="mat-padding-small"></div>
            <div style="display:flex; flex-direction:column;">
              <mat-form-field appearance="outline" style="flex:1;">
                <mat-label>Nouveau mot de passe</mat-label>
                <mat-icon matSuffix>more_horiz</mat-icon>
                <input matInput type="password"  placeholder="Entrez votre nouveau mot de passe" formControlName="newpass" autocomplete="off">
              </mat-form-field>
              <mat-form-field appearance="outline"  style="flex:1;">
                <mat-label>Confirmez le mot de passe</mat-label>
                <mat-icon matSuffix>more_horiz</mat-icon>
                <input matInput  type="password" placeholder="Confirmez le mot de passe" formControlName="cpass"  autocomplete="off">
                @if (pForm.controls.newpass.value != pForm.controls.cpass.value) {
                  <mat-error>La confirmation du nouveau mot de passe est incorrecte</mat-error>
                }
              </mat-form-field>
            </div>
          </div>
          <div matPadding  style="display:flex; flex-direction:row; justify-content:center; align-items:center; flex:1;" >
            <div matPaddingSmall matRounded style="flex:1;"></div>
            <button [disabled]="pForm.invalid" rightIcon  mat-flat-button (click)="savePassword()" color="primary">
              <span>Valider</span>
            </button>
          </div>
        </form>

      </div>
    </div>


  </div>
</div>
