<mat-card matPadding style="display:flex; flex-direction:column; margin:0; width:100%; height:100%; min-width:100%; min-height:100%;" class="dTheme">
  <div matPadding style="display:flex; flex-direction:column;">
    <div matPadding style="display:flex; flex-direction:row; justify-content:flex-start; align-items:center;">
      <div class="mat-headline capitalize" style="font-weight: 100; margin: 0px; flex:1;" matPaddingSmall>{{title}}
      </div>
      <button (click)="close()" mat-icon-button>
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div style="display:flex; flex-direction:column; flex:1;" matPadding>
      <div style="display:flex; flex-direction:column;" matPadding>
        <div style="display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; flex:1;">

          @if (message) {
            <div class="mat-body-2 capitalize" style="font-weight: 100;">{{message}}</div>
          }
          @if (actionBtn) {
            <div matPadding>
              <button color="primary" (click)="goTo(actionBtn.link)" mat-flat-button mat-button>
                <span class="mat-body-2 capitalize">{{actionBtn.label}}</span>
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</mat-card>
