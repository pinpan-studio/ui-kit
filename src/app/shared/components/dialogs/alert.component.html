<div style="display:flex; flex-direction:column; margin:0; width:100%; height:100%; min-width:100%; min-height:100%;" class="dTheme route">
    <div matPadding style="display:flex; flex-direction:column; justify-content:center; align-items:center; flex:1;">
        <div class="mat-headline capitalize">{{data.title}}</div>
        <div class="mat-body-1">{{data.message}}</div>
        <div matPadding></div>
        <div matPadding>
            <button color="primary" (click)="close()" mat-flat-button mat-button>
                <span  class="mat-body-2 capitalize">OK</span>
            </button>
        </div>
    </div>
</div>
